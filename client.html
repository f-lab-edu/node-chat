<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>채팅 서비스</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
      }
      .hidden {
        display: none !important;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .modal-content {
        background: white;
        padding: 2rem;
        border-radius: 0.5rem;
        width: 400px;
        position: relative;
      }
      .chatroom {
        border: 1px solid #ccc;
        padding: 0.5rem;
        margin-top: 0.5rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <!-- 1. 로그인 페이지 -->
    <div id="login-page">
      <h2>로그인</h2>
      <input type="text" id="login-id" placeholder="ID" /><br /><br />
      <input type="password" id="login-pw" placeholder="Password" /><br /><br />
      <button onclick="login()">로그인</button>
    </div>

    <!-- 2. 채팅 목록 페이지 -->
    <div id="chat-list-page" class="hidden">
      <h2>채팅 목록</h2>
      <button onclick="openModal()">채팅방 +</button>
      <div id="chatrooms"></div>
    </div>

    <!-- 3. 채팅방 생성 모달 -->
    <div
      id="chat-modal"
      class="modal hidden"
      onclick="handleOutsideClick(event)"
    >
      <div class="modal-content" onclick="event.stopPropagation()">
        <h3>채팅방 생성</h3>
        <label>채팅방 이름:</label><br />
        <input type="text" id="chatroom-name" /><br /><br />
        <label>친구 목록:</label><br />
        <div id="friend-list"></div>
        <br />
        <button id="create-btn">생성</button>
        <button id="close-btn">닫기</button>
      </div>
    </div>

    <script>
      const dummyFriends = [
        { name: '김철수', email: 'kim@example.com' },
        { name: '이영희', email: 'lee@example.com' },
        { name: '박민수', email: 'park@example.com' },
      ];

      document
        .getElementById('create-btn')
        .addEventListener('click', createChatroom);
      document
        .getElementById('close-btn')
        .addEventListener('click', closeModal);

      async function login() {
        const id = document.getElementById('login-id').value;
        const pw = document.getElementById('login-pw').value;
        if (id && pw) {
          const res = await fetch('http://localhost:8000/auths/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email: id }),
          });

          if (!res.ok) {
            throw new Error('서버 오류');
          }

          document.getElementById('login-page').classList.add('hidden');
          document.getElementById('chat-list-page').classList.remove('hidden');
          loadChatrooms();
        } else {
          alert('ID/PW를 입력해주세요.');
        }
      }

      async function loadChatrooms() {
        const chatrooms = document.getElementById('chatrooms');
        chatrooms.innerHTML = '<div class="chatroom">예시 채팅방 1</div>';
      }

      function openModal() {
        document.getElementById('chat-modal').classList.remove('hidden');
        const list = document.getElementById('friend-list');
        list.innerHTML = dummyFriends
          .map(
            (f, i) => `
          <label><input type="checkbox" value="${f.email}" /> ${f.name} (${f.email})</label><br />
        `,
          )
          .join('');
      }

      function closeModal() {
        const modal = document.getElementById('chat-modal');
        modal.classList.add('hidden');
      }

      function handleOutsideClick(event) {
        if (event.target.id === 'chat-modal') {
          closeModal();
        }
      }

      function createChatroom() {
        const name = document.getElementById('chatroom-name').value;
        const selected = Array.from(
          document.querySelectorAll('#friend-list input:checked'),
        ).map((el) => el.value);
        if (!name || selected.length === 0) {
          alert('채팅방 이름과 친구를 선택해주세요.');
          return;
        }
        const chatrooms = document.getElementById('chatrooms');
        const div = document.createElement('div');
        div.className = 'chatroom';
        div.textContent = `${name} (${selected.length}명)`;
        chatrooms.appendChild(div);
        closeModal();
      }
    </script>
  </body>
</html>
