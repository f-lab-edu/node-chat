<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WebSocket Client</title>
  </head>
  <body>
    <h1>WebSocket Chat Client</h1>
    <input id="email" placeholder="Your Email" />
    <input id="room" placeholder="Room to send message to" />
    <input id="message" placeholder="Message" />
    <button id="send">Send Message</button>

    <ul id="messages"></ul>

    <script>
      const socket = new WebSocket('ws://localhost:8000'); // 주소는 NestJS 웹소켓 서버 주소

      const subscribedRooms = ['room1', 'room2']; // 예시 방 목록

      socket.addEventListener('open', () => {
        console.log('WebSocket connection opened.');
      });

      socket.addEventListener('message', (event) => {
        let data;
        console.log('event.data: ', event.data);
        try {
          data =
            typeof event.data === 'string'
              ? JSON.parse(event.data)
              : event.data;
        } catch (e) {
          console.error('Invalid JSON:', event.data);
          return;
        }

        if (data.event === 'ready') {
          console.log('data.event: ', data.event);
          console.log('Received ready event. Sending join-rooms...');
          socket.send(
            JSON.stringify({
              event: 'join-rooms',
              data: subscribedRooms,
            }),
          );
        } else {
          const item = document.createElement('li');
          item.textContent = `[${data.room}] ${data.sender || 'unknown'}: ${data.message}`;
          document.getElementById('messages').appendChild(item);
        }
      });

      document.getElementById('send').addEventListener('click', () => {
        const room = document.getElementById('room').value;
        const message = document.getElementById('message').value;
        const email = document.getElementById('email').value;

        socket.send(
          JSON.stringify({
            event: 'send-message',
            data: {
              room,
              message: JSON.stringify({ sender: email, message }),
            },
          }),
        );
      });
    </script>
  </body>
</html>
